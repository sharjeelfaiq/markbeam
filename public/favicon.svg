<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Markbeam. The same mark as .brand__mark in the toolbar: a beam that fades to nothing at
    both ends, glowing on a dark field. Colours are the void and beam design tokens.

    No double hyphen anywhere in this comment. XML forbids it, and Chrome rejects the whole
    file rather than the comment, so writing the token names here with their CSS prefix made
    the favicon a broken image while `file` still called it a valid SVG.
  -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!--
      maskUnits="userSpaceOnUse" for the same reason as the filters above: the default mask
      region is derived from the masked group's bounding box, which is only the width of the
      two beam rects. That clipped the halo the filters had just spread outwards, leaving a
      pair of vertical seams either side of the glow.
    -->
    <mask id="ends" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="url(#fade)"/>
    </mask>
    <clipPath id="field">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
    <!--
      filterUnits="userSpaceOnUse" on purpose. The default is a percentage of each rect's
      own bounding box, and these rects are only a few px wide, so a stdDeviation of 3 was
      cut off mid-blur and left a hard vertical seam through the glow.
    -->
    <filter id="core" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#field)">
    <rect width="32" height="32" fill="#0b0d12"/>
    <g mask="url(#ends)">
      <rect x="13.4" y="0" width="5.2" height="32" fill="#4de1d0" opacity="0.42" filter="url(#halo)"/>
      <rect x="14.2" y="0" width="3.6" height="32" fill="#4de1d0" filter="url(#core)"/>
    </g>
  </g>
</svg>
