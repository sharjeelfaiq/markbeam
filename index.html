<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Markbeam — Online Markdown Editor with Live Preview</title>
    <meta name="description" content="Write Markdown and watch it render as you type. Live preview, Mermaid diagrams, math, and PDF, HTML and Word export — free, no signup, in your browser.">
    <meta name="color-scheme" content="dark light">

    <script>
      /*
       * Pre-paint theme resolution. Runs before first paint so a reload never flashes
       * the wrong theme. Deliberately duplicates logic in src/theme.js — this has to be
       * inline and synchronous, it cannot wait for a module.
       */
      (function () {
        try {
          // Falls back to the pre-rename key so an existing visitor does not get a
          // theme flash on their first load after the storage change.
          var stored = localStorage.getItem('markbeam:theme')
            || localStorage.getItem('com.markdownlivepreview_theme');

          // Older builds wrote booleans here.
          if (stored === 'true') { stored = 'dark'; }
          if (stored === 'false') { stored = 'light'; }

          var resolved = stored;
          if (resolved !== 'dark' && resolved !== 'light') {
            // unset, or an explicit 'system' preference
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- ===================================================================
         Search and social metadata.

         CHANGING THE DOMAIN: replace `https://markbeam.vercel.app` in this
         block — six occurrences, all within these tags — and in three other
         files that also carry absolute URLs and cannot reference this one:

             public/about.html    (canonical + og:url + og:image)
             public/robots.txt    (Sitemap:)
             public/sitemap.xml   (both <loc> entries)

         Those three are static files copied verbatim, so they have no way to
         read a value from here. Grep for the host before declaring it done.

         Why the URL is repeated rather than held in a variable: social
         scrapers (Slack, Twitter, iMessage) do not run JavaScript, so these
         cannot be injected at runtime, and the two build-time routes are
         both closed. `.env` is gitignored, so Vite's `%VITE_*%` HTML
         replacement would be undefined in Vercel's build and would ship a
         broken canonical; and this project deliberately has no
         `vite.config.*` (see CLAUDE.md), so there is no transformIndexHtml
         hook to put it in.
         =================================================================== -->
    <link rel="canonical" href="https://markbeam.vercel.app/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Markbeam">
    <meta property="og:title" content="Markbeam — Online Markdown Editor with Live Preview">
    <meta property="og:description" content="Write Markdown and watch it render as you type. Live preview, Mermaid diagrams, math, and PDF, HTML and Word export — free, in your browser.">
    <meta property="og:url" content="https://markbeam.vercel.app/">
    <meta property="og:image" content="https://markbeam.vercel.app/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Markbeam — Online Markdown Editor with Live Preview">
    <meta name="twitter:description" content="Write Markdown and watch it render as you type. Live preview, Mermaid diagrams, math, and PDF, HTML and Word export — free, in your browser.">
    <meta name="twitter:image" content="https://markbeam.vercel.app/og.png">

    <!-- Structured data. Deliberately no `aggregateRating` or `review`: there
         are no ratings to report, and inventing them is both a lie and a
         structured-data policy violation. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Markbeam",
        "description": "An online Markdown editor with live preview, Mermaid diagrams, math rendering and export to PDF, HTML, Word and Markdown. Runs entirely in the browser.",
        "url": "https://markbeam.vercel.app/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Live Markdown preview",
          "Mermaid diagrams",
          "LaTeX math rendering",
          "Paste or drop images, processed and stored locally",
          "Export to PDF, HTML, Word and Markdown",
          "Shareable links",
          "Autosave history",
          "Documents stored locally, with no account and nothing uploaded",
          "Works offline after the first visit"
        ]
      }
    </script>

    <!-- Styling for the no-JavaScript case only.
         Every stylesheet is imported by `src/main.js`, so with scripting off the page has no
         CSS at all. This block is the only styling that reaches those visitors, which is why
         it is inline and why it hides the app chrome: the toolbar, panes and status bar are
         non-functional without the editor, so showing them would be worse than not.
         Not cloaking — Googlebot executes JavaScript and sees the app, and this content says
         the same thing the app does. -->
    <noscript>
      <style>
        body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; }
        .toolbar, .pane-tabs, .workspace, .statusbar, .toasts { display: none; }
        .noscript { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; }
        .noscript h1 { font-size: 1.75rem; line-height: 1.2; }
        .noscript a { color: #0d9488; }
        @media (prefers-color-scheme: dark) {
          body { background: #0e1015; color: #e8edf5; }
          .noscript a { color: #4de1d0; }
        }
      </style>
    </noscript>

    <!-- SVG first so the mark stays crisp on hidpi tabs; the PNG is the fallback for
         browsers that still do not take an SVG icon. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0e1015">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png">
    <script type="module" src="/src/main.js"></script>
  </head>

  <body data-view="split">
    <!-- Without this, a visitor with JavaScript disabled got the toolbar and status bar and
         nothing else: measured at 0 headings and 109 characters, all of it button labels,
         with an empty editor and an empty preview. Editing genuinely requires JavaScript, so
         this explains that rather than pretending otherwise, and points at the page that
         does work without it. -->
    <noscript>
      <div class="noscript">
        <h1>Markbeam — online Markdown editor with live preview</h1>
        <p>
          Markbeam renders Markdown as you type: source on the left, formatted output on the
          right. It supports GitHub-Flavored Markdown, Mermaid diagrams, LaTeX math, callouts
          and task lists, and exports to PDF, HTML, Word and Markdown. Documents are stored in
          your own browser — there is no account and nothing is uploaded.
        </p>
        <p>
          The editor itself needs JavaScript to run, so it cannot start right now. Enable
          JavaScript for this site to use it, or read
          <a href="/about.html">what Markbeam does</a> first.
        </p>
      </div>
    </noscript>

    <header class="toolbar">
      <a class="brand" href="/" aria-label="Markbeam home">
        <span class="brand__mark" aria-hidden="true"></span>
        Markbeam
      </a>

      <!-- Title and caret share one box so the pair reads as a combobox. The switcher
           belongs with the thing that names the document, and anchoring it here costs no
           width on a toolbar row that is already full. -->
      <div class="doc-switcher">
        <input
          id="doc-title"
          class="doc-title"
          type="text"
          value="Untitled"
          aria-label="Document title"
          spellcheck="false"
          autocomplete="off">

        <button
          id="docs-button"
          class="btn btn--icon btn--caret"
          type="button"
          title="Documents"
          aria-label="Documents"
          aria-haspopup="dialog">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6.5 8 10.5l4-4"/>
          </svg>
        </button>
      </div>

      <span class="toolbar__spacer"></span>

      <div class="segmented" role="group" aria-label="View mode">
        <button class="segmented__item" type="button" data-view-mode="editor" aria-pressed="false" title="Editor only (Ctrl+1)">Edit</button>
        <button class="segmented__item" type="button" data-view-mode="split" aria-pressed="true" title="Split view (Ctrl+2)">Split</button>
        <button class="segmented__item" type="button" data-view-mode="preview" aria-pressed="false" title="Preview only (Ctrl+3)">Read</button>
      </div>

      <!-- Carries `segmented` so it inherits the pressed-state beam colour and, with it,
           the max-width:768px rule that hides the view-mode control. That is right rather
           than convenient: below 768px only one pane is ever on screen, so there is
           nothing to sync. -->
      <div class="segmented" role="group" aria-label="Scroll">
        <button id="sync-button" class="segmented__item" type="button" aria-pressed="false" title="Sync scroll">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 2.8v10.4M2.6 4.7l1.9-1.9 1.9 1.9"/>
            <path d="M11.5 13.2V2.8M9.6 11.3l1.9 1.9 1.9-1.9"/>
          </svg>
          Sync
        </button>
      </div>

      <div class="toolbar__group">
        <button id="copy-button" class="btn" type="button" title="Copy Markdown source">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/>
            <path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/>
          </svg>
          <span class="toolbar__label">Copy</span>
        </button>

        <button id="export-button" class="btn btn--accent" type="button" title="Export as PDF (Ctrl+S)">

            <path d="M8 1.8v8.4M4.8 7l3.2 3.2L11.2 7"/>
            <path d="M2.5 12.2v1.3a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1.3"/>
          </svg>
          <span class="toolbar__label">PDF</span>
        </button>

        <!-- Destructive, so grouped with the utility buttons rather than beside Copy/PDF. -->
        <button id="clear-button" class="btn btn--icon" type="button" title="Clear document" aria-label="Clear document">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.1 1.8H4.2a1 1 0 0 0-1 1v10.4a1 1 0 0 0 1 1h7.6a1 1 0 0 0 1-1V5.7Z"/>
            <path d="M9.1 1.8v3.9h3.7"/>
            <path d="M6.5 8.9l3 3M9.5 8.9l-3 3"/>

        </button>

        <button id="menu-button" class="btn btn--icon" type="button" title="Commands (Ctrl+K)" aria-label="Open command palette">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>

        <button id="theme-button" class="btn btn--icon" type="button" aria-label="Switch theme">

            <path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7Z"/>

            <circle cx="8" cy="8" r="3.1"/>
            <path d="M8 1.3v1.6M8 13.1v1.6M14.7 8h-1.6M2.9 8H1.3M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4 3.3 3.3"/>
          </svg>
        </button>
      </div>
    </header>

    </footer>

    <!-- Opened programmatically from the palette and the documents sheet. Hidden rather
         than styled: a bare file input cannot be made to match the toolbar, and the two
         real entry points are the sheet and drag-and-drop. -->
    <input
      type="file"
      id="file-input"
      accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain"
      multiple
      hidden>

    <input
      type="file"
      id="image-input"
      accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
      multiple
      hidden>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <dialog class="sheet" id="palette" aria-label="Command palette">
      <input
        class="sheet__input"
        id="palette-input"
        type="text"
        placeholder="Type a command…"
        aria-label="Search commands"
        autocomplete="off"
        spellcheck="false">
      <ul class="sheet__list" id="palette-list" role="listbox" aria-label="Commands"></ul>
    </dialog>

    <!-- Reuses the palette's `sheet` styling wholesale; the only new CSS is the row layout
         for a document's name and its timestamp. -->
    <dialog class="sheet" id="docs" aria-label="Documents">
      <ul class="sheet__list" id="docs-list" aria-label="Open a document"></ul>
      <ul class="sheet__list sheet__list--actions" id="docs-actions" aria-label="Document actions"></ul>
    </dialog>

    <!-- The outline. Rebuilt each time it opens, because the document changes constantly. -->
    <dialog class="sheet" id="outline" aria-label="Document outline">
      <ul class="sheet__list" id="outline-list" aria-label="Jump to a heading"></ul>
    </dialog>

    <!-- Autosave history. Its own sheet rather than a third list in #docs: that one is
         about which document is open, this is about which version of it. Same classes. -->
    <dialog class="sheet" id="history" aria-label="Document history">
      <ul class="sheet__list" id="history-list" aria-label="Restore an earlier version"></ul>
    </dialog>
  </body>
</html>
